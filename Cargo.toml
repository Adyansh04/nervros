[workspace]
resolver = "3"
members = [
    "crates/rosidl-schema",
    "crates/nervros-ros",
    "crates/nervros-core",
    "crates/nervros-viz",
    "apps/nervros-cli",
    "apps/nervros-gui",
]
default-members = [
    "crates/rosidl-schema",
    "crates/nervros-core",
    "apps/nervros-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/Adyansh04/nervros"
authors = ["Adyansh Gupta"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
mod_module_files = "deny"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace.dependencies]
anyhow = "=1.0.104"
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
futures = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rig = { version = "=0.42.0", features = ["test-utils"] }
schemars = "=1.2.2"
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
