[package]
name = "nervros-ros"
description = "ROS 2 access for NervROS: calls by type string, action jobs, snapshots, images and TF behind one trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["rcl"]
# The r2r backend: links rcl, so building needs a sourced ROS environment (scripts/ros-env.sh).
rcl = ["dep:r2r"]
# `fake::FakeRobot`, for other crates' tests; production builds leave it out.
test-support = []

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
r2r = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
image.workspace = true
uuid.workspace = true
