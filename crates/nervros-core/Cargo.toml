[package]
name = "nervros-core"
description = "The NervROS agent core: configuration, model providers, tools, guard, missions and the session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# The ROS node itself (r2r and a sourced ROS install); off, the core builds anywhere.
rcl = ["nervros-ros/rcl"]

[dependencies]
async-trait.workspace = true
nervros-ros = { path = "../nervros-ros", default-features = false }
rosidl-schema = { path = "../rosidl-schema" }
uuid.workspace = true
base64.workspace = true
futures.workspace = true
image.workspace = true
reqwest.workspace = true
rig.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
rig = { workspace = true, features = ["test-utils"] }
bytes.workspace = true
tempfile.workspace = true
