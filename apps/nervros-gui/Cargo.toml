[package]
name = "nervros-gui"
description = "The NervROS desktop app: chat beside an embedded Rerun viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Spans to an OpenTelemetry collector when OTEL_EXPORTER_OTLP_ENDPOINT is set.
otlp = ["nervros-core/otlp"]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
clap.workspace = true
image.workspace = true
mimalloc.workspace = true
nervros-core = { path = "../../crates/nervros-core", features = ["rcl"] }
nervros-ros = { path = "../../crates/nervros-ros", default-features = false }
nervros-viz = { path = "../../crates/nervros-viz" }
rerun.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe"] }
nervros-ros = { path = "../../crates/nervros-ros", default-features = false, features = ["test-support"] }
tempfile.workspace = true
