[package]
name = "nervros-cli"
description = "Headless NervROS: chat, doctor, evals and replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["ros"]
# Talk to a live ROS graph through r2r; needs a sourced ROS environment (scripts/ros-env.sh).
ros = ["nervros-core/rcl"]
# Spans to an OpenTelemetry collector when OTEL_EXPORTER_OTLP_ENDPOINT is set.
otlp = ["nervros-core/otlp"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
nervros-core = { path = "../../crates/nervros-core" }
nervros-ros = { path = "../../crates/nervros-ros", default-features = false }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
sha2.workspace = true
humantime.workspace = true
tokio.workspace = true
