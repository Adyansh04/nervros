# The profile for robot programs and searches on the scripted robot: the scenarios' robot with a
# world model that knows rooms, objects and their history.
#   nervros-cli --profile scenarios/jobs/nervros.toml eval scenarios/jobs/suite.toml \
#     --robot scenarios/robot/robot.toml --robot scenarios/jobs/robot.toml

[robot]
name = "A humanoid test robot in a four-room flat"

[ros]
interfaces = ["/opt/ros/jazzy", "../robot/interfaces"]

[policy]
start_armed = false

[world]
rooms = { topic = "/canopy/rooms", type = "canopy_msgs/msg/RoomArray" }
objects = { topic = "/canopy/objects", type = "canopy_msgs/msg/WorldObjectArray" }
history = "/canopy/object_history"

[mission]
execute = "/x/execute_mission"
validate = "/x/validate_mission"
catalog = "/x/get_catalog"
stop = "/x/stop_all"
state = "/x/robot_state"

[mission.checks]
turn = { skill = "TurnInPlace", degrees = "degrees" }
walk = { skill = "WalkStraight", metres = "distance_m", direction = "direction", max_m = 2.0 }
arm = "arm"

[[place]]
name = "dock"
pose = { x = 0.5, y = 0.5 }

[models]
file = "../../profiles/example/models.toml"
