# Robot programs and searches, over scenarios/robot/robot.toml: the catalog with FindInView, four
# typed rooms with how much of each the camera has seen, the objects the world model knows, and its
# history of a moved mug.
#   nervros-cli --profile scenarios/jobs/nervros.toml eval scenarios/jobs/suite.toml \
#     --robot scenarios/robot/robot.toml --robot scenarios/jobs/robot.toml

[topics."/canopy/rooms"]
rooms = [
    { id = "R1", name = "room A", type = "living_room", area = 20.0, floor_coverage = 0.8, centroid = { x = 2.0, y = 2.0 }, outline = { points = [{ x = 0.0, y = 0.0 }, { x = 4.0, y = 0.0 }, { x = 4.0, y = 4.0 }, { x = 0.0, y = 4.0 }] } },
    { id = "R2", name = "room B", type = "kitchen", area = 16.0, floor_coverage = 0.9, centroid = { x = 6.0, y = 2.0 }, outline = { points = [{ x = 4.0, y = 0.0 }, { x = 8.0, y = 0.0 }, { x = 8.0, y = 4.0 }, { x = 4.0, y = 4.0 }] } },
    { id = "R3", name = "room C", type = "office", area = 12.0, floor_coverage = 0.4, centroid = { x = 2.0, y = 6.0 }, outline = { points = [{ x = 0.0, y = 4.0 }, { x = 4.0, y = 4.0 }, { x = 4.0, y = 8.0 }, { x = 0.0, y = 8.0 }] } },
    { id = "R4", name = "room D", type = "bedroom", area = 14.0, floor_coverage = 0.2, centroid = { x = 6.0, y = 6.0 }, outline = { points = [{ x = 4.0, y = 4.0 }, { x = 8.0, y = 4.0 }, { x = 8.0, y = 8.0 }, { x = 4.0, y = 8.0 }] } },
]

[topics."/canopy/objects"]
objects = [
    { id = "O17", label = "mug", name = "red mug", room_id = "R2", state = 0, last_seen = { sec = 1760000000 }, pose = { position = { x = 5.0, y = 1.0, z = 0.8 }, orientation = { w = 1.0 } }, size = { x = 0.1, y = 0.1, z = 0.1 } },
    { id = "O21", label = "mug", name = "white mug", room_id = "R3", state = 0, last_seen = { sec = 1760000000 }, pose = { position = { x = 1.0, y = 5.0, z = 0.7 }, orientation = { w = 1.0 } }, size = { x = 0.1, y = 0.1, z = 0.1 } },
    { id = "O22", label = "mug", name = "blue mug", room_id = "R2", state = 1, last_seen = { sec = 1759990000 }, pose = { position = { x = 7.0, y = 1.0, z = 0.8 }, orientation = { w = 1.0 } }, size = { x = 0.1, y = 0.1, z = 0.1 } },
    { id = "O30", label = "tray", name = "wooden tray", room_id = "R1", state = 0, last_seen = { sec = 1760000000 }, pose = { position = { x = 1.0, y = 1.0, z = 0.5 }, orientation = { w = 1.0 } }, size = { x = 0.4, y = 0.3, z = 0.05 } },
    { id = "O31", label = "chair", name = "chair", room_id = "R1", state = 0, last_seen = { sec = 1760000000 }, pose = { position = { x = 3.0, y = 1.0, z = 0.45 }, orientation = { w = 1.0 } }, size = { x = 0.5, y = 0.5, z = 0.9 } },
    { id = "O32", label = "chair", name = "office chair", room_id = "R3", state = 0, last_seen = { sec = 1760000000 }, pose = { position = { x = 3.0, y = 6.0, z = 0.45 }, orientation = { w = 1.0 } }, size = { x = 0.5, y = 0.5, z = 0.9 } },
    { id = "O33", label = "chair", name = "chair", room_id = "R2", state = 0, last_seen = { sec = 1760000000 }, pose = { position = { x = 6.0, y = 3.0, z = 0.45 }, orientation = { w = 1.0 } }, size = { x = 0.5, y = 0.5, z = 0.9 } },
    { id = "O34", label = "chair", name = "armchair", room_id = "R1", state = 0, last_seen = { sec = 1760000000 }, pose = { position = { x = 1.0, y = 3.0, z = 0.45 }, orientation = { w = 1.0 } }, size = { x = 0.8, y = 0.8, z = 0.9 } },
]

# Every mission succeeds, and a look hands on what it saw.
[actions."/x/execute_mission"]
feedback = [{ elapsed_s = 1.0, events = [{ name = "s1", path = "s1", status = 2 }] }]
status = "succeeded"
result = { outcome = 0, failed_step_id = "", failure_reason = "", outputs_json = '{"s1_object_id": "mug_1", "s2_object_id": "mug_1"}' }

[services."/canopy/object_history"]
events = [
    { id = "O22", label = "mug", kind = "moved", room_id = "R4", position = { x = 6.5, y = 6.5, z = 0.0 }, stamp = { sec = 1759995000 } },
]
message = ""

[services."/x/get_catalog"]
catalog_json = '''
{
 "catalog_version": "scenario-jobs",
 "skills": [
  {
   "name": "GoToTarget",
   "description": "Walk to a room or an object in the world model and stop facing it. Use it to get within reach of an object before PickObject or PlaceInto.",
   "args": [
    {
     "name": "target",
     "type": "world_id",
     "description": "The id of a room or an object in the world model, such as R2 or O17."
    }
   ],
   "requires": [],
   "effects": [
    "near(target)"
   ],
   "resources": [
    "base"
   ],
   "idempotent": true,
   "risk": "motion",
   "max_duration_s": 240,
   "template": "GoToTarget"
  },
  {
   "name": "GoToPose",
   "description": "Walk to a fixed place given as coordinates in the map frame, then turn to face the given heading. Use it for a named place whose coordinates are known.",
   "args": [
    {
     "name": "station",
     "type": "string",
     "format": "station",
     "description": "Where to stand and face, as x;y;yaw in the map frame, metres and radians, such as 4.30;-5.60;1.5708."
    }
   ],
   "requires": [],
   "effects": [
    "at(station)"
   ],
   "resources": [
    "base"
   ],
   "idempotent": true,
   "risk": "motion",
   "max_duration_s": 240,
   "template": "GoToPose"
  },
  {
   "name": "WalkStraight",
   "description": "Walk straight forward or backward by a set distance and stop, without turning. Use it for small exact moves such as \"move 1 metre ahead\", \"go 2 metres forward\" or \"back up half a metre\"; a longer distance takes several steps of at most 2 m. To get to a place use GoToPose or GoToTarget. The distance is measured from where the robot stands, along the way it faces, and it ends within about 5 cm past it. Nav2 checks the way against what the LiDAR sees, as a circle of 0.45 m around the body: if something is in the way the robot stops where it is, part of the way, and the step fails. It never walks around anything and does not see an arm held out or something carried, so tuck the arms first when they are out.",
   "args": [
    {
     "name": "direction",
     "type": "string",
     "description": "Which way to walk, relative to where the robot faces.",
     "enum": [
      "forward",
      "backward"
     ]
    },
    {
     "name": "distance_m",
     "type": "string",
     "format": "number",
     "min": 0.1,
     "max": 2.0,
     "description": "How far to walk, in metres, from 0.1 to 2.0. Always positive; direction says which way."
    }
   ],
   "requires": [],
   "effects": [],
   "resources": [
    "base"
   ],
   "idempotent": false,
   "risk": "motion",
   "max_duration_s": 35,
   "template": "WalkStraight"
  },
  {
   "name": "TurnInPlace",
   "description": "Turn on the spot by an angle from where the robot faces now, and stop: positive turns left (counter-clockwise seen from above), negative turns right, up to half a turn either way. Use it for \"turn right 90 degrees\", \"turn around\" (180), \"spin in place\" (two steps of 180) or to face a direction before WalkStraight; to face a place use GoToPose. It ends within about 5 degrees of the angle. It fails at once, before turning, when something is within 0.45 m of the robot's centre.",
   "args": [
    {
     "name": "degrees",
     "type": "string",
     "format": "number",
     "min": -180,
     "max": 180,
     "description": "How far to turn, in degrees, from -180 to 180; positive is left."
    }
   ],
   "requires": [],
   "effects": [],
   "resources": [
    "base"
   ],
   "idempotent": false,
   "risk": "motion",
   "max_duration_s": 30,
   "template": "TurnInPlace"
  },
  {
   "name": "PickObject",
   "description": "Pick an object up with one hand: look for it, close the last stretch to it, grasp and lift, then back away. The robot must already stand within about half a metre of the object, and the object must lie on a surface, not on the floor. The hand keeps holding it afterwards, even if the mission is stopped.",
   "args": [
    {
     "name": "object_id",
     "type": "string",
     "format": "id",
     "description": "The object to pick: its id in the world model (such as O17) or, where there is no world model, the name the detector reports it under (such as red_block). Letters, digits and underscores. The detector reports what it finds under the lowercased id, and the later steps look for it there."
    },
    {
     "name": "phrase",
     "type": "string",
     "format": "phrase",
     "default_from": "label(object_id)",
     "description": "Plain words the detector finds the object by, such as the world model's label for it (red mug). Wording that names colour and kind tells look-alikes apart better."
    },
    {
     "name": "arm",
     "type": "string",
     "description": "Which hand picks it up.",
     "enum": [
      "left",
      "right"
     ]
    }
   ],
   "requires": [
    "near(object_id)",
    "hand_empty(arm)"
   ],
   "effects": [
    "holding(arm, object_id)"
   ],
   "resources": [
    "base",
    "left_arm",
    "right_arm"
   ],
   "idempotent": false,
   "risk": "manipulation",
   "max_duration_s": 420,
   "template": "PickObject"
  },
  {
   "name": "PlaceInto",
   "description": "Put the object a hand holds into a container: look for the container, close in, lower, release, and back away. The robot must already stand within about half a metre of the container, which must be a tray or box on a bench or table, not on the floor.",
   "args": [
    {
     "name": "container_id",
     "type": "string",
     "format": "id",
     "description": "The container: its id in the world model (such as O31) or, where there is no world model, the name the detector reports it under (such as brown_box). Letters, digits and underscores."
    },
    {
     "name": "phrase",
     "type": "string",
     "format": "phrase",
     "default_from": "label(container_id)",
     "description": "Plain words the detector finds the container by, such as the world model's label for it (basket). Wording that names colour and kind tells look-alikes apart better."
    },
    {
     "name": "arm",
     "type": "string",
     "description": "Which hand holds the object.",
     "enum": [
      "left",
      "right"
     ]
    }
   ],
   "requires": [
    "near(container_id)",
    "holding(arm, X)"
   ],
   "effects": [
    "inside(X, container_id)",
    "hand_empty(arm)"
   ],
   "resources": [
    "base",
    "left_arm",
    "right_arm"
   ],
   "idempotent": false,
   "risk": "manipulation",
   "max_duration_s": 360,
   "template": "PlaceInto"
  },
  {
   "name": "TuckForTravel",
   "description": "Fold both arms against the body so they do not disturb the walk. An arm whose hand holds something is left where it is. Use it before walking when the arms are out.",
   "args": [],
   "requires": [],
   "effects": [],
   "resources": [
    "left_arm",
    "right_arm"
   ],
   "idempotent": true,
   "risk": "motion",
   "max_duration_s": 120,
   "template": "TuckForTravel"
  },
  {
   "name": "FindInView",
   "description": "Look for something with the arm camera's detector from where the robot stands, and hand on the name the detector reports it under.",
   "args": [
    {
     "name": "phrase",
     "type": "string",
     "format": "phrase",
     "description": "What to look for, in a word or two, such as mug."
    }
   ],
   "outputs": [
    {
     "name": "object_id",
     "type": "string",
     "format": "id",
     "description": "The detector's name for what it saw."
    }
   ],
   "requires": [],
   "effects": [],
   "resources": [],
   "idempotent": true,
   "risk": "observe",
   "max_duration_s": 20,
   "template": "FindInView"
  }
 ]
}
'''
